name: Security

# Three checks. Every number in the comments below was measured by running the
# tool against this repository, not read from a vendor page. The commands are in
# the security report on the ci-security branch.
#
#   secret-scan             8 findings over 206 commits, 7 in the tree, all read
#                           by hand, all false positives. .gitleaks.toml removes
#                           exactly those. The scan is a gate.
#   dependency-audit-python 37 packages in the installed set, 0 vulnerabilities,
#                           4.2 s. A gate.
#   dependency-audit-node   Two scopes, both measured. Production: 0 findings,
#                           exit 0, gated. Dev tree: 5 findings, exit 1, counted
#                           into the job summary and not enforced. See below.
#
# Three things this workflow deliberately does NOT do:
#
#   * It does not gate on the dev dependency tree. `npm audit` over the whole
#     tree exits non-zero at every severity threshold, because the tree carries
#     a critical finding, so a full-scope gate cannot pass. The five findings
#     are all devDependencies and none reaches the shipped bundle. The gate is
#     the production scope, and the dev count is published next to it so the
#     flag that makes the job green cannot hide it.
#   * It does not use the gitleaks GitHub Action. gitleaks-action v2 asks an
#     organisation for a licence key. The binary is fetched from the release and
#     checked against a checksum committed in this file, which is both free and
#     a tighter control, because the expected hash is reviewed in the pull request.
#   * It does not add Dependabot for the action pins. Jev returned `uncertain`
#     on that question (0.43), and adding an updater changes who opens pull
#     requests in this repository. That is a human's call. See the PR body.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # Checkout only. The scan reads committed history; it writes nothing.
    permissions:
      contents: read
    steps:
      # >>> SECURITY AGENT START
      # Pinned to the commit of a fixed patch tag, not to the moving major tag.
      # Resolved from the GitHub API by reading the commit v4.4.0 points at.
      # To bump: resolve the new tag to a SHA, replace the SHA, keep the comment
      # true. See the note above the jobs in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks git scans commits. A shallow clone would scan a handful of
          # them and report "no leaks found" about almost nothing, which is the
          # same false green as a check that was never run.
          fetch-depth: 0
      # <<< SECURITY AGENT END

      # The expected hash is written here rather than taken from the download,
      # because a checksum file fetched from the same place as the binary proves
      # only that the two arrived together. This value is the one worth
      # reviewing, because it is in the pull request.
      - name: Install gitleaks 8.30.1 and check its checksum
        env:
          GL_VERSION: '8.30.1'
          GL_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          asset="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          curl -fsSLO "${base}/${asset}"
          echo "${GL_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `--config .gitleaks.toml` is not optional. Without it the scan reports the
      # 7 measured false positives and the job is red on arrival, which is worse
      # than no scan because it teaches everyone to ignore it. The config is the
      # record of why each one is a false positive.
      #
      # `git .` rather than `dir .`: the history scan only reads tracked files,
      # so it cannot pick up a local __pycache__/*.pyc. A directory scan on a
      # developer's machine does pick those up, which is why the local count was
      # 7 and this one is 0.
      - name: Refuse a committed secret
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose

  # ---------------------------------------------------------------------------
  dependency-audit-python:
    name: Dependency audit (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # >>> SECURITY AGENT START
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # <<< SECURITY AGENT END

      # The same install the `backend` job performs, deliberately. `--local`
      # audits the environment that is actually installed here rather than a
      # fresh resolution of the declared ranges, so the audit covers the
      # versions the tests run against. Measured on this machine: 4.2 s and 37
      # distributions, against 31.6 s and 19 distributions for
      # `pip-audit backend`, which resolves live and so audits whatever PyPI
      # serves that day.
      #
      # pip-audit is pinned because an unpinned scanner is itself an unpinned
      # dependency. Its own transitive dependencies are inside the audited set,
      # which is the honest arrangement: they are part of the build's supply
      # chain too.
      - name: Install the backend and the auditor
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'
          pip install 'pip-audit==2.10.1'

      - name: Refuse a dependency with a known vulnerability
        run: pip-audit --local --progress-spinner off

  # ---------------------------------------------------------------------------
  # Two scopes, measured on 2026-10-03 against this lock file. Both are correct
  # answers to different questions.
  #
  #   npm audit              -> exit 1, 5 findings (1 critical, 1 high, 3 moderate)
  #   npm audit --omit=dev   -> exit 0, 0 findings
  #
  # The dependency counts are identical in both runs (prod 6, dev 384, optional
  # 122, peer 8, total 389). The tree is not what differs. The scope flag is.
  # All five findings are in the dev tree: vitest, vite, vite-node, esbuild and
  # @vitest/mocker. None reaches the shipped bundle.
  #
  # So the gate is the production scope, which is what a buyer would ever run,
  # and the full count is published beside it so the dev-tree findings stay
  # visible instead of being hidden by the flag that makes the job green.
  dependency-audit-node:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # >>> SECURITY AGENT START
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # <<< SECURITY AGENT END

      # npm ci, not npm install: the lock file is the thing under audit, and npm
      # install would be free to rewrite it, which would audit a tree nobody
      # ships.
      - name: Install the frontend from the lock file
        working-directory: frontend
        run: npm ci

      # The gate. This is the production dependency tree, it is green today, and
      # it is the tree that ends up in the bundle. No threshold flag: --omit=dev
      # already narrows the scope, and adding --audit-level on top would only
      # obscure which of the two knobs did the work.
      - name: Refuse a production dependency with a known vulnerability
        working-directory: frontend
        run: npm audit --omit=dev

      # The dev tree, counted and published but not enforced.
      #
      # `set -uo pipefail` with no `-e` is the whole point of this step, and it is
      # not a `|| true` in disguise. npm audit exits non-zero whenever it finds
      # anything, so with -e the step would abort on line two and the count would
      # be the thing we lose. The exit status is captured, printed, and written to
      # the summary rather than discarded.
      #
      # A parse failure is reported, not fatal. The gate is the step above and it
      # already passed, so this step must not block a merge for a reporting
      # problem. It says so in the log and says so in the summary, because a
      # summary that quietly omits the count is the same as no count at all.
      #
      # What turns the dev tree into a gate: the vitest 5 upgrade, which is what
      # `npm audit fix --force` resolves all five findings with. Add `--audit-level`
      # to the gate above and delete this step in that same change, so the gate and
      # its fix land together and the job is never red on arrival.
      - name: Publish the dev-tree finding count
        working-directory: frontend
        env:
          SUMMARY: ${{ github.step_summary }}
        run: |
          set -uo pipefail
          npm audit --json > npm-audit-full.json
          status=$?
          echo "full-scope npm audit exit status: ${status} (expected non-zero: 5 dev-tree findings)"

          # Parsed with node rather than jq. Two reasons. setup-node has already
          # put node on the PATH in this job, so this adds nothing to install,
          # and it does not lean on jq being preinstalled on the runner image,
          # which is an assumption about an image that changes under you.
          # Single quotes, so bash expands nothing inside and the JavaScript
          # keeps its own string concatenation.
          node -e '
            const fs = require("fs");
            function publish(text) {
              const target = process.env.SUMMARY || process.env.GITHUB_STEP_SUMMARY;
              if (!target) {
                console.error("no summary path in the environment; log only");
                console.log(text);
                return;
              }
              fs.appendFileSync(target, text);
            }
            let report;
            try {
              report = JSON.parse(fs.readFileSync("npm-audit-full.json", "utf8"));
            } catch (error) {
              console.error("could not read the npm audit report: " + error.message);
              publish("## npm dependency audit\n\n"
                + "**The dev-tree count could not be measured.** See the job log.\n");
              process.exit(0);
            }
            const meta = (report.metadata && report.metadata.vulnerabilities) || {};
            const count = function (key) { return meta[key] || 0; };
            const found = Object.keys(report.vulnerabilities || {}).map(function (name) {
              const entry = report.vulnerabilities[name];
              return "- **" + entry.severity + "** " + name + " " + (entry.range || "");
            });
            const lines = [
              "## npm dependency audit",
              "",
              "Production dependencies are gated by the step above. These are the",
              "dev-tree findings, counted and not enforced.",
              "",
              "| Scope | Critical | High | Moderate | Low | Total |",
              "|---|---|---|---|---|---|",
              "| Production (gated) | 0 | 0 | 0 | 0 | 0 |",
              "| Dev tree (reported) | " + count("critical") + " | " + count("high")
                + " | " + count("moderate") + " | " + count("low")
                + " | " + count("total") + " |",
              "",
              found.length ? found.join("\n") : "_none_",
              "",
            ];
            publish(lines.join("\n"));
            console.log("critical=" + count("critical") + " high=" + count("high")
              + " moderate=" + count("moderate") + " low=" + count("low")
              + " total=" + count("total"));
          '
name: CI

# The feature host exists so that a hundred features, written by a hundred agents
# in a hundred worktrees, can merge without three-way conflicts. That only holds
# if a feature branch keeps to adding files, and the only way to guarantee that
# at scale is to make CI refuse the merge rather than trusting every agent to
# remember the rule. The guard below is the enforcement point.
#
# Two deliberate asymmetries:
#
#   * The shared-file guard runs on pull_request but NOT on push to main. Platform
#     work legitimately edits shared files - it is how a new extension point gets
#     added - so a hard failure there would block the very commits that keep the
#     contract current.
#   * The tests run everywhere. There is no "tests are only needed on features"
#     escape hatch, because the audit guarantee is the product.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push to the same branch makes an in-flight run irrelevant. The audit
  # trail records every completed run, so cancelling superseded ones keeps that
  # trail meaningful instead of full of stale results.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Feature contract (no shared files)
    # Platform work on main is allowed to edit shared files; a feature branch is
    # not. Skipping main is what keeps that distinction enforceable.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs against origin/main, so the base ref must exist.
          # A shallow clone of the PR branch alone would make it silently pass.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A shared-file edit is a violation unless the PR is *labelled* platform
      # work, and the label is the record a reviewer sees. Deriving the exemption
      # from a label rather than a hand-passed flag means the decision is written
      # down in the PR, not typed into a CI invocation nobody reviews.
      - name: Refuse shared-file edits
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'platform-change') }}" = "true" ]; then
            echo "PR carries the platform-change label; shared-file edits are a recorded decision."
            python tools/check_feature_diff.py --base origin/main --platform-change
          else
            python tools/check_feature_diff.py --base origin/main
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'

      - name: Run the suite
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # Tests run BEFORE the build, deliberately, and the order is the point.
      # A failing test and a failing build are different bugs, but `npm run
      # build` is the louder of the two: the bundler fails on a compile error
      # anywhere in the bundle, so a single broken assertion would be reported
      # behind whatever the bundler tripped over first. Running the cheap,
      # specific signal first means the build is only attempted once the thing
      # it is meant to prove -- that the pages behave -- already holds.
      #
      # `npm run test` is `vitest run`: one pass, no watcher, no TTY. That is
      # what keeps this step from hanging the runner to the job timeout, which
      # is the usual way a test step goes wrong in CI. There is deliberately no
      # `test:watch` here; that script exists for a human at a terminal. CI=1 is
      # set explicitly so the non-interactive intent does not depend on the
      # runner happening to set it. The same reasoning is why the test config
      # pins NODE_ENV=test rather than inheriting it: vitest only defaults it
      # when it is unset, so an inherited NODE_ENV=production loads React's
      # production bundle, `act()` throws, and the step goes red for a reason
      # that reads like a React bug rather than an environment one. This runner
      # does not set NODE_ENV, which is precisely why that failure would stay
      # invisible here and surface only on a contributor's machine.
      #
      # This step cannot pass on an empty run. If the `include` glob in
      # vitest.config.js ever stops matching, `vitest run` exits 1 with "No test
      # files found", and `passWithNoTests: false` is pinned in that config to
      # keep it that way -- the same command with `--passWithNoTests` exits 0.
      # Do not add that flag to make a red suite green.
      #
      # No coverage step, on purpose. No coverage provider is installed
      # (@vitest/coverage-v8 is not in devDependencies) and the project has not
      # agreed a threshold, so gating on a number nobody has agreed to is a
      # check that decays into one people learn to ignore. Report-only coverage
      # is a separate decision, for a human, once there is a provider.
      #
      # The `lint` job is NOT here on purpose: it is owned by agent B, who is
      # adding the eslint/prettier config and .pre-commit-config.yaml in
      # parallel. A lint step written before that tooling lands would reference
      # a command that is not installed and turn a missing dependency into a red
      # build for the wrong reason. Agent B adds that job; do not duplicate it.
      - name: Test
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test

      # A feature whose page does not compile must not merge. The frontend host
      # discovers features by globbing src/features/*\/index.jsx, so a broken
      # feature only fails here rather than in a browser.
      - name: Build
        working-directory: frontend
        run: npm run build

  design-floor:
    name: Design floor
    # A check that only reports is a check that decays, so this one fails.
    # See docs/adr/0002-design-floor-is-a-ci-gate.md.
    #
    # The allowlist in tools/design_floor_allowlist.json is empty and the
    # shipped pages are clean: 43 pages, 0 findings. It was 14 when the job
    # landed, and those were fixed rather than allowlisted, which is the only
    # reason this is green today. The first time this job ran it went red and
    # stayed red until the findings were genuinely fixed; adding a page to the
    # allowlist is the only way to keep it green, and that is a visible debt
    # someone has to choose to carry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse a page that misses the floor
        run: python tools/check_design_floor.py --fail-on-warn

  end-to-end:
    name: Local host app (headless)
    runs-on: ubuntu-latest
    # The heavier of the checks: it installs both toolchains and starts a real
    # server. It is the job that answers "would a browser actually load this",
    # which unit tests and a build cannot.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # A feature whose page ships empty is a feature nobody can review, so the
      # demo dataset is part of what is being verified, not a convenience.
      - name: Seed a fresh demo database
        env:
          DSR_DB_PATH: ${{ runner.temp }}/ci.db
          DSR_AUDIT_DIR: ${{ runner.temp }}/ci-audit
        run: python backend/seed.py

      - name: Start the app
        env:
          DSR_DB_PATH: ${{ runner.temp }}/ci.db
          DSR_AUDIT_DIR: ${{ runner.temp }}/ci-audit
        run: |
          python -m uvicorn dsr.api:app --app-dir backend --host 127.0.0.1 --port 8000 &
          # Poll rather than sleep a fixed amount: a slow runner would otherwise
          # fail a healthy build, which trains people to ignore red.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up"
          exit 1

      # Every feature's own routes are checked here too, not just the core ones:
      # a plugin that failed to import is skipped by the host and reported at
      # /api/features, so an unhandled failure would otherwise look like a
      # passing build.
      - name: Verify what a browser would load
        run: python tools/verify_localhost.py

      - name: No feature failed to load
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/api/features", timeout=15) as r:
              reg = json.load(r)
          failed = reg.get("failed", [])
          if failed:
              for f in failed:
                  print(f"  {f.get('id')}: {f.get('error')}")
              raise SystemExit(f"{len(failed)} feature(s) failed to load")
          print(f"OK: {reg['count']} feature(s) loaded, 0 failed")
          PY

      # Calls every (method, path) the registry advertises and fails on a 5xx.
      # The checks above prove a module imported and that the core routes
      # answer; neither proves that each of the 800-odd feature routes behind
      # them has a working handler, so a mounted route that 500s was invisible.
      # A 404 for a room that does not exist is the API correctly refusing and
      # is not counted.
      - name: Every advertised route answers
        run: python tools/verify_all_routes.py --base http://127.0.0.1:8000

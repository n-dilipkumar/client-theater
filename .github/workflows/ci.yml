name: CI

# The feature host exists so that a hundred features, written by a hundred agents
# in a hundred worktrees, can merge without three-way conflicts. That only holds
# if a feature branch keeps to adding files, and the only way to guarantee that
# at scale is to make CI refuse the merge rather than trusting every agent to
# remember the rule. The guard below is the enforcement point.
#
# Two deliberate asymmetries:
#
#   * The shared-file guard runs on pull_request but NOT on push to main. Platform
#     work legitimately edits shared files - it is how a new extension point gets
#     added - so a hard failure there would block the very commits that keep the
#     contract current.
#   * The tests run everywhere. There is no "tests are only needed on features"
#     escape hatch, because the audit guarantee is the product.

# >>> SPEED AGENT START
#
# MEASURED 2026-10-03. Read this before you try to make this workflow faster.
# Source: step timings from twelve runs of this workflow on GitHub Actions,
# databaseId 37009181528 through 37060049338, runner image ubuntu-24.04
# 20260927.320.1. Whole seconds, as GitHub reports them. No number here comes
# from a stopwatch on a developer machine, because agents run this repository on a
# host where three suites share eight cores.
#
#   Job                                 median of 12 runs
#   Backend tests                            143 s   <- slowest in all 12
#   Local host app (headless)                 44 s
#   Lint (ruff, eslint, prettier)             44 s
#   Frontend build                            30 s
#   Feature contract (no shared files)         8 s
#   Design floor                               7 s
#                                        ---------
#   total                                    276 s of runner time per run
#
# The jobs run in parallel, so the Backend tests job sets the wall clock by
# itself. Its 143 s is checkout 3 s, setup-python 0 s, install 10 s, pytest 125 s.
# One second off pytest is one second off the wall clock. One second off any other
# job is runner minutes only, and this repository is public, so those minutes cost
# nothing.
#
# SIX CANDIDATES, MEASURED AND SETTLED. Each one went to Jev with these numbers.
# The audit ids and the full write-up are in orchestration/TEST-REFACTOR.md,
# section 10.
#
# 1. Share one npm install across the three jobs that need it. REJECTED.
#    npm ci takes 4 s: median of 35 CI samples, range 2 s to 6 s, not 40 s.
#    Consolidating saves 8 runner-seconds and 0 wall-clock seconds. Every way to
#    share the tree costs more than 8 s. actions/cache cannot save from three
#    parallel jobs that all miss it. upload-artifact plus download-artifact costs
#    about 7 s for a 400 MB node_modules. Combining the jobs lengthens the
#    critical path. The comment in the lint job below argues for keeping the
#    second npm ci, and the measurement backs that comment.
#
# 2. setup-node with cache: npm. VERIFIED WORKING. NO CHANGE.
#    Across twelve run logs: 36 npm cache hits, 12 pip cache hits, 0 misses.
#    The npm cache reports 35058354 B every time. The key never misses, so there
#    is nothing to correct here.
#
# 3. Add cache: pip to the guard, backend and end-to-end jobs. REJECTED.
#    The cached install takes 9 s median and the uncached install 10 s median, so
#    the saving is inside the noise. setup-python with a cache costs 2 s median
#    against 0 s without one. Net effect about minus 1 s per Python job. The
#    install resolves 34 packages in about 10 s, so the download is a small part
#    of it, and the cache restore costs more than the download it replaces.
#
# 4. Combine jobs to cut machine allocations. REJECTED.
#    Lint and Frontend build finish in 44 s in parallel today. One combined job
#    would take about 63 s, which is the sum of the steps the combined job keeps.
#    That trades 19 s of wall clock for 11 free runner-seconds. Guard and Design
#    floor could fold for 9 runner-seconds, which merges two named checks to save
#    something that costs nothing.
#
# 5. Add path filters. REJECTED, and not because of the fraction.
#    37 of the 60 pull requests here, 62 percent, touch no file under frontend/.
#    So the Frontend build job has nothing to do on most pull requests. It still
#    saves 0 wall-clock seconds, because that job takes 30 s and the critical path
#    takes 143 s. A job that a path filter skips reports as skipped, and a skipped
#    required check blocks the merge. And paths: on pull_request does not apply to
#    push to main, so the pull request run would check less than the push run.
#
# 6. Concurrency. VERIFIED CORRECT. NO CHANGE.
#    github.ref reads refs/pull/N/merge for a pull request and refs/heads/main for
#    a push, so one group never mixes the two events.
#
# WHAT IS WORTH THE NEXT AGENT'S TIME: in the Backend tests job, pytest-xdist
# prints "bringing up nodes..." 39.7 s after the pytest step starts on a cold
# runner. Those seconds cover collection and worker startup, and they live in
# backend/. A workflow file cannot reach them. The suite itself needs 73.6 s warm
# and 99.9 s cold, so about 26 s of every run is a cold-cache premium that one
# suite run per job can never avoid.
#
# ==============================================================================
# <<< SPEED AGENT END

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push to the same branch makes an in-flight run irrelevant. The audit
  # trail records every completed run, so cancelling superseded ones keeps that
  # trail meaningful instead of full of stale results.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Feature contract (no shared files)
    # Platform work on main is allowed to edit shared files; a feature branch is
    # not. Skipping main is what keeps that distinction enforceable.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs against origin/main, so the base ref must exist.
          # A shallow clone of the PR branch alone would make it silently pass.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A shared-file edit is a violation unless the PR is *labelled* platform
      # work, and the label is the record a reviewer sees. Deriving the exemption
      # from a label rather than a hand-passed flag means the decision is written
      # down in the PR, not typed into a CI invocation nobody reviews.
      - name: Refuse shared-file edits
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'platform-change') }}" = "true" ]; then
            echo "PR carries the platform-change label; shared-file edits are a recorded decision."
            python tools/check_feature_diff.py --base origin/main --platform-change
          else
            python tools/check_feature_diff.py --base origin/main
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # >>> COVERAGE AGENT START
          # Full history, not a shallow clone of the pull request branch. Two
          # things below need the merge base: the list of files this change
          # touched, and the `origin/<base>` ref that list is diffed against. A
          # shallow clone has neither, and an empty changed-file list is
          # indistinguishable from "this pull request touched no Python".
          fetch-depth: 0
          # <<< COVERAGE AGENT END

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # >>> COVERAGE AGENT START
          # setup-python's pip cache is keyed on the dependency file named here.
          # backend/pyproject.toml is the only file in this repository that
          # declares the backend dependencies, so it is the key. Without this the
          # step looks for a requirements.txt that does not exist, finds nothing,
          # and silently never restores a cache.
          cache: pip
          cache-dependency-path: backend/pyproject.toml
          # <<< COVERAGE AGENT END

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'

# >>> COVERAGE AGENT START
      #
      # The gate is checked before it is trusted. This runs in under a second,
      # needs no test suite, and proves the four exit codes and the comment body
      # against synthetic reports. It runs first so a broken gate is reported
      # before the suite spends four minutes producing a report nobody can read.
      - name: Prove the coverage gate fails when it should
        run: python tools/coverage_gate_selftest.py
      #
      # The floor in orchestration/TEST-REFACTOR.md section 2 had nothing behind
      # it. This job is what puts something behind it.
      #
      # `addopts` in backend/pyproject.toml already carries `-n auto`, so pytest
      # runs under xdist here exactly as it did before this change. pytest-cov
      # has each xdist worker write its own data file and combines them in the
      # controller, so the report below is the union across workers and not one
      # worker's subset. That was measured, not assumed: see
      # orchestration/TEST-REFACTOR.md, section "Agent coverage".
      #
      # No `-p no:cacheprovider`, no second `-q`. `addopts` already has one `-q`
      # and a second one suppresses the final counts line entirely, which is how a
      # run prints progress to 100 percent and reports nothing.
      - name: Run the suite with coverage
        working-directory: backend
        run: >
          python -m pytest
          --cov=dsr
          --cov-report=json:coverage.json
          --cov-report=term:skip-covered

      # On a pull request, the files this change touched. On a push to main,
      # the files this commit touched. Both are written to one file so the gate
      # and the comment read the same list.
      #
      # `fetch-depth: 0` above is what makes `origin/<base>` exist, so no fetch
      # is needed here. The three-dot form asks git for the merge base, which is
      # what makes the list the change rather than the whole branch.
      - name: List the files this change touched
        run: |
          set -euo pipefail
          mkdir -p backend
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > backend/coverage-changed.txt
          else
            git diff --name-only "HEAD^...HEAD" > backend/coverage-changed.txt
          fi
          echo "Files this change touched:"
          cat backend/coverage-changed.txt

      # The gate. It reads backend/coverage.json, recomputes the percentage from
      # the per-file counts in that file, and exits non-zero when the total is
      # below the floor. No threshold is passed on the command line, because
      # FLOOR_PERCENT is a constant in tools/coverage_gate.py and a threshold a
      # pull request can change is not a threshold.
      - name: Enforce the coverage floor
        run: >
          python tools/coverage_gate.py
          --report backend/coverage.json
          --changed-from backend/coverage-changed.txt
          --comment-out backend/coverage-comment.md

      # The comment body is an artifact so the job below does not need to run the
      # suite a second time to produce it.
      - name: Upload the coverage report and comment body
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage.json
            backend/coverage-changed.txt
            backend/coverage-comment.md
          if-no-files-found: warn
          retention-days: 14

      # The plain `python -m pytest` step that used to be here is replaced, not
      # kept alongside. Two suite runs would double this job's cost to measure
      # one number, and the second run would report a different coverage figure
      # from the one the gate has just judged. This block is the only place the
      # backend suite runs in this workflow.

      # <<< COVERAGE AGENT END

  # >>> COVERAGE AGENT START
  coverage-comment:
    name: Coverage comment
    needs: backend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block for this job only.
    # Declaring them here rather than editing the workflow-level `permissions`
    # is deliberate: another agent owns that line, and this job needs a write
    # scope the backend suite does not.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      # `actions/github-script` is bundled with the runner, so this adds no
      # dependency to install and no lockfile to keep current. The comment body
      # was formatted by tools/coverage_gate.py in the job above, which is the
      # same script a human runs locally before merging a format change.
      #
      # The body carries a marker. This step finds an existing comment carrying
      # that marker and updates it in place, so forty pushes produce one comment
      # and not forty. A pull request nobody reads is a pull request with no
      # gate on it.
      #
      # A permission failure is stated in plain words on the run page and in the
      # job summary. It does not fail the step: the gate above is the enforcement
      # point, and a fork pull request that cannot comment is a known limit of
      # the `pull_request` trigger, not a reason to report the coverage job red.
      - name: Post or update the coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- ci-coverage-gate -->';
            const bodyPath = path.join(
              process.env.GITHUB_WORKSPACE, 'coverage-report', 'coverage-comment.md'
            );

            if (!fs.existsSync(bodyPath)) {
              const note = 'The coverage job produced no comment body, so there is nothing to post. '
                + 'Open backend/coverage.json in the coverage-report artifact to see why.';
              core.warning(note);
              await core.summary.addRaw(note).write();
              return;
            }

            const body = fs.readFileSync(bodyPath, 'utf8');
            if (!body.includes(marker)) {
              // Refuse to post a body the marker step cannot find again. Without
              // this a format change silently turns the sticky comment into one
              // new comment per push.
              core.setFailed('The comment body does not carry the sticky marker ' + marker);
              return;
            }

            const head = context.payload.pull_request.head.repo.full_name;
            const base = context.payload.repository.full_name;
            const isFork = head !== base;

            try {
              const listed = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = listed.data.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info('Updated the existing coverage comment ' + existing.id);
              } else {
                const created = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
                core.info('Created the coverage comment ' + created.data.id);
              }
            } catch (error) {
              const note = isFork
                ? 'The coverage comment was not posted because this pull request comes from the '
                  + 'fork ' + head + '. GitHub gives a pull_request workflow on a fork a read-only '
                  + 'token, so writing a comment is refused. The coverage gate itself ran and its '
                  + 'result is in the backend job. Read the number from that job, or from '
                  + 'backend/coverage.json in the coverage-report artifact. GitHub failure reason: '
                  + error.message
                : 'The coverage comment was not posted. GitHub failure reason: ' + error.message;
              core.warning(note);
              await core.summary.addRaw(note).write();
            }
  # <<< COVERAGE AGENT END

      # >>> SPEED AGENT NOTE, KEPT BY THE COVERAGE AGENT
      #
      # The speed agent's `Run the suite` step used to sit here and has been
      # absorbed by the coverage step above rather than deleted. Two suite runs
      # would double this job's cost to measure one number, and the second run
      # would report a different coverage figure from the one the gate has just
      # judged. `addopts` still carries `-n auto`, so the suite still runs across
      # workers exactly as the speed agent measured it.
      #
      # The speed agent's measurement, kept verbatim so the reasoning survives
      # the merge: `-n auto` stays. It was measured on an 8-core workstation. It
      # was measured again on this 4 vCPU runner, both arms interleaved on one
      # runner, three rounds each. Six workers lost by 3.9 s at the warm minimum
      # and the two arms did not overlap once warm. Collection scales with the
      # worker count, and six workers cost 4.5 s more of it than four did. The
      # measurement is in orchestration/TEST-REFACTOR.md, section 10.
      # <<< SPEED AGENT NOTE END

  # The linter is a gate, not a report. See the "no escape hatches" note below:
  # a lint job that reports and passes is worse than no lint job, because it looks
  # like enforcement.
  #
  # There is no `if:` here, so this runs on pull_request AND on pushes to main.
  # That asymmetry matters for a linter specifically: the whole reason
  # backend/tests/test_wf056.py reached main unformatted is that nothing ran
  # ruff on the way in. Skipping main would let a direct push reintroduce the
  # exact drift this job exists to catch. The `guard` job's push-to-main skip is
  # about *contract* edits, which platform work legitimately makes; lint debt is
  # never legitimate on any branch.
  lint:
    name: Lint (ruff, eslint, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installed from the backend `dev` extras rather than by naming a ruff
      # version here, so that backend/pyproject.toml stays the single source of
      # truth for the pin. A version written into this workflow would be a second
      # place to forget to bump, and a linter that silently changes version is a
      # linter whose findings are not reproducible.
      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'

      # ---------------------------------------------------------------------
      # READ THIS BEFORE "SIMPLIFYING" THE TWO COMMANDS BELOW.
      #
      # The ruff configuration lives in backend/pyproject.toml, and `tools/`
      # and `orchestration/` live outside `backend/`. So `--config` and the
      # explicit path list are BOTH load-bearing. A bare `ruff check .` from the
      # repo root finds no config, silently falls back to ruff's own defaults
      # (which enable PLW/RUF/FURB), and reports several hundred findings that
      # are almost entirely inside the vendored .agents/ and .claude/ skill
      # directories. Nothing announces that the flag is missing; the output just
      # reads like the repository is full of errors, which trains everyone to
      # ignore it. Do not drop the flag and do not replace the paths with `.`.
      # ---------------------------------------------------------------------

      # ruff check before ruff format, and both before `npm ci`: the Python
      # linters cost seconds and `npm ci` costs about a minute, so this ordering
      # means the common failure (a stray unused import) is reported without
      # paying for the Node install first.
      - name: ruff check
        run: ruff check backend tools orchestration --config backend/pyproject.toml

      - name: ruff format --check
        run: ruff format --check backend tools orchestration --config backend/pyproject.toml

      - name: Install frontend linters
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: prettier
        working-directory: frontend
        run: npm run format:check

      # No `|| true`, no `continue-on-error`, no `--exit-zero`, and no
      # `--max-warnings`. A warning is still a finding, and `eslint .` already
      # exits non-zero on errors without any of those; adding them back would
      # turn this job into a comment in the checks list. If a rule is wrong,
      # fix the rule in frontend/eslint.config.js on its own branch, which is a
      # reviewable decision, rather than muting it here where nobody sees it.
      #
      # This job also runs its own `npm ci` instead of folding the two frontend
      # checks into the `frontend` job, which is a deliberate trade:
      #
      #   * it is a separately named check, so a lint failure does not arrive
      #     under a job called "Frontend build" and get misread as a bundler
      #     problem;
      #   * it fails in parallel with `backend` instead of queueing behind the
      #     frontend test and build steps, so a lint error is reported in
      #     seconds rather than after a full test-and-build cycle;
      #   * the cost is a second `npm ci`. That is not new to this workflow --
      #     `end-to-end` already installs node_modules a second time -- and
      #     setup-node's npm cache means the repeat is mostly a cache restore.

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # Tests run BEFORE the build, deliberately, and the order is the point.
      # A failing test and a failing build are different bugs, but `npm run
      # build` is the louder of the two: the bundler fails on a compile error
      # anywhere in the bundle, so a single broken assertion would be reported
      # behind whatever the bundler tripped over first. Running the cheap,
      # specific signal first means the build is only attempted once the thing
      # it is meant to prove -- that the pages behave -- already holds.
      #
      # `npm run test` is `vitest run`: one pass, no watcher, no TTY. That is
      # what keeps this step from hanging the runner to the job timeout, which
      # is the usual way a test step goes wrong in CI. There is deliberately no
      # `test:watch` here; that script exists for a human at a terminal. CI=1 is
      # set explicitly so the non-interactive intent does not depend on the
      # runner happening to set it. The same reasoning is why the test config
      # pins NODE_ENV=test rather than inheriting it: vitest only defaults it
      # when it is unset, so an inherited NODE_ENV=production loads React's
      # production bundle, `act()` throws, and the step goes red for a reason
      # that reads like a React bug rather than an environment one. This runner
      # does not set NODE_ENV, which is precisely why that failure would stay
      # invisible here and surface only on a contributor's machine.
      #
      # This step cannot pass on an empty run. If the `include` glob in
      # vitest.config.js ever stops matching, `vitest run` exits 1 with "No test
      # files found", and `passWithNoTests: false` is pinned in that config to
      # keep it that way -- the same command with `--passWithNoTests` exits 0.
      # Do not add that flag to make a red suite green.
      #
      # No coverage step, on purpose. No coverage provider is installed
      # (@vitest/coverage-v8 is not in devDependencies) and the project has not
      # agreed a threshold, so gating on a number nobody has agreed to is a
      # check that decays into one people learn to ignore. Report-only coverage
      # is a separate decision, for a human, once there is a provider.
      #
      # The eslint and prettier checks live in the `lint` job above, not here.
      # They arrived with frontend/eslint.config.js and .prettierrc, so the
      # earlier note on this step -- that the lint job belonged to whichever
      # branch added the tooling, and should not be duplicated -- is now
      # resolved. It was written, and it is called `lint`. Do not re-add a second
      # copy of `npm run lint` here; two copies means two places to forget.
      - name: Test
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test

      # A feature whose page does not compile must not merge. The frontend host
      # discovers features by globbing src/features/*\/index.jsx, so a broken
      # feature only fails here rather than in a browser.
      - name: Build
        working-directory: frontend
        run: npm run build

  design-floor:
    name: Design floor
    # A check that only reports is a check that decays, so this one fails.
    # See docs/adr/0002-design-floor-is-a-ci-gate.md.
    #
    # The allowlist in tools/design_floor_allowlist.json is empty and the
    # shipped pages are clean: 43 pages, 0 findings. It was 14 when the job
    # landed, and those were fixed rather than allowlisted, which is the only
    # reason this is green today. The first time this job ran it went red and
    # stayed red until the findings were genuinely fixed; adding a page to the
    # allowlist is the only way to keep it green, and that is a visible debt
    # someone has to choose to carry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse a page that misses the floor
        run: python tools/check_design_floor.py --fail-on-warn

  end-to-end:
    name: Local host app (headless)
    runs-on: ubuntu-latest
    # The heavier of the checks: it installs both toolchains and starts a real
    # server. It is the job that answers "would a browser actually load this",
    # which unit tests and a build cannot.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # A feature whose page ships empty is a feature nobody can review, so the
      # demo dataset is part of what is being verified, not a convenience.
      - name: Seed a fresh demo database
        env:
          DSR_DB_PATH: ${{ runner.temp }}/ci.db
          DSR_AUDIT_DIR: ${{ runner.temp }}/ci-audit
        run: python backend/seed.py

      - name: Start the app
        env:
          DSR_DB_PATH: ${{ runner.temp }}/ci.db
          DSR_AUDIT_DIR: ${{ runner.temp }}/ci-audit
        run: |
          python -m uvicorn dsr.api:app --app-dir backend --host 127.0.0.1 --port 8000 &
          # Poll rather than sleep a fixed amount: a slow runner would otherwise
          # fail a healthy build, which trains people to ignore red.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up"
          exit 1

      # Every feature's own routes are checked here too, not just the core ones:
      # a plugin that failed to import is skipped by the host and reported at
      # /api/features, so an unhandled failure would otherwise look like a
      # passing build.
      - name: Verify what a browser would load
        run: python tools/verify_localhost.py

      - name: No feature failed to load
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/api/features", timeout=15) as r:
              reg = json.load(r)
          failed = reg.get("failed", [])
          if failed:
              for f in failed:
                  print(f"  {f.get('id')}: {f.get('error')}")
              raise SystemExit(f"{len(failed)} feature(s) failed to load")
          print(f"OK: {reg['count']} feature(s) loaded, 0 failed")
          PY

      # Calls every (method, path) the registry advertises and fails on a 5xx.
      # The checks above prove a module imported and that the core routes
      # answer; neither proves that each of the 800-odd feature routes behind
      # them has a working handler, so a mounted route that 500s was invisible.
      # A 404 for a room that does not exist is the API correctly refusing and
      # is not counted.
      - name: Every advertised route answers
        run: python tools/verify_all_routes.py --base http://127.0.0.1:8000

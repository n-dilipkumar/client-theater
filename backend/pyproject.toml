[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsr"
version = "0.1.0"
description = "Open-source Digital Sales Room - audited SQLite backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    # Parses multipart/form-data request bodies, which is how a document or
    # deck upload arrives. FastAPI requires this to be installed for a
    # route that accepts one; without it the plugin host refuses to load
    # the feature rather than mounting a route that would 500 on every use.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dsr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# Pre-commit hooks for the Digital Sales Room.
#
# Every hook is pinned to a commit SHA rather than a floating tag. That is a
# supply-chain requirement, not a style preference: a tag can be moved to point
# at new code, so `rev: v6.0.0` means "whatever v6.0.0 points at when the hook
# runs". A SHA names the exact tree that was reviewed. This repo is built on the
# idea that a decision is a record, and a hook that can change under you is a
# decision you did not make.
#
# Bump with `pre-commit autoupdate`, which is itself the tool for moving a pin
# deliberately and leaving a commit behind that says so.
#
# Install:  python -m pip install pre-commit && pre-commit install

default_language_version:
  python: python3

# Paths no hygiene hook may rewrite. Shared across the hooks below rather than
# repeated per hook, because the same three groups are unowned in every case.
#
# 1. Vendored skill payloads (.agents/, .claude/). Pinned by skills-lock.json
#    and byte-identical to upstream; rewriting them invalidates the lock.
# 2. Markdown. Two trailing spaces is a hard line break in Markdown, and the
#    generated boards and briefs under orchestration/ rely on it. Stripping
#    whitespace there changes a document's rendered meaning, not its bytes.
# 3. Generated JSON and the Jev audit log: append-only, and regenerated by the
#    tool that owns them rather than edited.
exclude: |
  (?x)^(
    \.agents/.*|
    \.claude/.*|
    orchestration/decisions/.*|
    orchestration/STATUS\.md|
    orchestration/WORKFLOW-BOARD\.md|
    orchestration/PROGRAM-AUDIT\.md|
    orchestration/AGENTS\.md|
    orchestration/ports/.*|
    orchestration/summaries\.json|
    orchestration/batch-state\.json|
    orchestration/board-sync-state\.json|
    docs/research/.*|
    design-system/.*|
    .*\.md
  )$

repos:
  # ---------------------------------------------------------------- hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # v6.0.0, 2026-09-29
    rev: 1f20705e3fbacaaa3af09982f83fd4cfbf355c51
    hooks:
      # The top-level `exclude` applies here. Markdown is excluded because a
      # trailing space is meaningful in it, not merely because it is generated.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      # A committed private key is the one failure this project cannot recover
      # from by rewriting history, so it is checked first and unconditionally.
      - id: detect-private-key

  # ----------------------------------------------------------------- python ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # v0.16.10, mirrors the ruff pinned in backend/pyproject.toml dev extras
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253
    hooks:
      # `--fix` applies only the safe fixes and fails on the rest, so a
      # mechanical violation is repaired for the author and a judgement call is
      # left for them to make.
      - id: ruff-check
        args: ["--fix", "--config", "backend/pyproject.toml"]
      # ruff-pre-commit already passes --force-exclude, which is what makes the
      # `extend-exclude` list in backend/pyproject.toml bind: without it, an
      # explicitly-passed path is linted even when the config excludes it.
      # Passing it again here is an error, not an override.
      - id: ruff-format
        args: ["--config", "backend/pyproject.toml"]

  # --------------------------------------------------------------- frontend ---
  # ESLint and Prettier run through `system` rather than the node/ESLint mirror
  # hooks. The mirror builds a Node environment from a lockfile we do not own;
  # this repo already pins eslint, prettier and their plugins in
  # frontend/package-lock.json, so invoking the installed binaries keeps one
  # version of the linter in the tree rather than two.
  - repo: local
    hooks:
      # `npm --prefix frontend run <script>` rather than `cd frontend && npx ...`:
      # `cd` is a shell builtin, and pre-commit executes a hook without a shell,
      # so a `cd` entry fails outright on Windows with
      # "Executable `cd` not found". npm --prefix sets the package root and is
      # portable. It also runs the script from package.json rather than a
      # parallel npx invocation, so there is one command to keep correct.
      #
      # Both hooks pass no filenames to the tool and lint/format the whole
      # frontend instead. That is deliberate: eslint and prettier are
      # project-wide by nature (the eslint config resolves plugins and the
      # prettier config resolves .prettierignore relative to the package root),
      # and pre-commit's per-file mode would need both to accept explicit paths.
      #
      # No `types:` on either hook, and that is deliberate.
      #
      # pre-commit's file filter requires `tags >= types` - a file must carry
      # EVERY listed type, not any one of them. So `types: [javascript, jsx]`
      # matches nothing at all, because no single file is both a `javascript`
      # and a `jsx`. Worse, it fails silently: the hook reports "no files to
      # check" and passes. `types_or` is the disjunctive form, but the simplest
      # correct answer is to let the `files:` regex do the selection and drop
      # `types` entirely.
      #
      # The eslint hook runs project-wide rather than on the staged files,
      # because `eslint .` and `eslint <file>` resolve the flat config and the
      # package root identically only in the first form, and because a rule that
      # depends on another file (a duplicated export, an unused import used by a
      # sibling) is only correct over the whole project.
      #
      # When this config landed, `npm run lint` reported 7 errors and this hook
      # failed. It is now 0 errors, 81 warnings, all of them warnings this config
      # deliberately reports rather than suppresses. The 7 were fixed rather than
      # tuned away; see the commit that follows this one. Worth recording
      # because it is the evidence for keeping `no-undef` at error severity: it
      # found two shipped ReferenceErrors that 9,946 Python tests and 117
      # vitest tests had never reached.
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
        pass_filenames: false
        require_serial: true

      - id: prettier
        name: prettier --check (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
        require_serial: true
